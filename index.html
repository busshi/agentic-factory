<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title / description / canonical / robots / og:url / og:locale /
         og:image / twitter:image are set per-route via <Head> (see
         Site.tsx, LegalMeta.tsx, App.tsx's LanguageRedirect) so the
         prerendered HTML carries the correct, per-locale values — no
         static default is declared here to avoid duplicate, conflicting
         tags. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" hreflang="fr" href="https://agentic-factory.fr/fr" />
    <link rel="alternate" hreflang="en" href="https://agentic-factory.fr/en" />
    <link rel="alternate" hreflang="x-default" href="https://agentic-factory.fr/en" />

    <!-- Open Graph / Twitter: type, site name and card format don't vary
         by locale, so they stay static here; title/description/image are
         set per-route via <Head>. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgenticFactory" />
    <meta property="og:title" content="AgenticFactory — Agents IA sur-mesure pour automatiser vos process métier" />
    <meta property="og:description" content="Des agents IA codés sur-mesure, branchés sur vos outils réels — pas des scénarios no-code qui lâchent au premier imprévu. Audit gratuit pour PME et startups." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgenticFactory — Agents IA sur-mesure pour automatiser vos process métier" />
    <meta name="twitter:description" content="Des agents IA codés sur-mesure, branchés sur vos outils réels. Audit gratuit pour PME et startups." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking: the stylesheet applies once it arrives
         (media="print" doesn't match on load, then onload switches it to
         "all"), instead of holding up first paint for a third-party
         round-trip. text stays in the fallback font until it swaps in
         (font-display=swap), so nothing is invisible in the meantime. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>

    <!-- Structured data (schema.org) — helps both classic search engines
         and AI answer engines (GEO) understand who this is and what it
         offers, in an unambiguous machine-readable form. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "AgenticFactory",
      "alternateName": "agentic-factory.fr",
      "url": "https://agentic-factory.fr/",
      "description": "AgenticFactory conçoit et code des agents IA sur-mesure pour automatiser les process métier des PME et petites startups : facturation, support client, qualification de leads.",
      "areaServed": "FR",
      "availableLanguage": ["fr", "en"],
      "email": "contact@agentic-factory.fr",
      "sameAs": [
        "https://www.linkedin.com/in/alexandre-dubar"
      ],
      "makesOffer": {
        "@type": "Offer",
        "name": "Audit gratuit d'automatisation par agents IA",
        "price": "0",
        "priceCurrency": "EUR"
      }
    }
    </script>
  </head>
  <body class="bg-bg text-text font-body antialiased">
    <!-- Populated at build time with real prerendered markup for each
         route (see vite-react-ssg in src/main.tsx) — crawlers that don't
         execute JavaScript still get the actual page content, not an
         empty shell. React hydrates over this on the client. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
